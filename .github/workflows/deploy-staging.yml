name: Deploy Staging

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  deploy-staging:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/deploy-base.yml
    with:
      bucket: staging.mattlane.us
      base_url: https://staging.mattlane.us
      role_arn: arn:aws:iam::492635958177:role/GitHubActionsPersonalSiteStagingRole
    secrets:
      cloudfront_distribution_id: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}

  staging-checks:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy passed or skipped
        run: |
          echo "deploy-staging: ${{ needs.deploy-staging.result }}"
          result="${{ needs.deploy-staging.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            exit 1
          fi
