name: Deploy Base

on:
  workflow_call:
    inputs:
      bucket:
        required: true
        type: string
      base_url:
        required: true
        type: string
      role_arn:
        required: true
        type: string
    secrets:
      cloudfront_distribution_id:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ inputs.base_url }}
      - run: aws s3 sync out/ s3://${{ inputs.bucket }}/ --region us-east-1
      - name: Invalidate CloudFront and wait
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --id "$INVALIDATION_ID"
      - run: aws s3 sync out/ s3://${{ inputs.bucket }}/ --region us-east-1 --delete
