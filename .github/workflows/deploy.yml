name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::492635958177:role/GitHubActionsPersonalSiteDeployRole
          aws-region: us-east-1
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://mattlane.us
      - run: npx s3-deploy './out/**' --cwd './out/' --region us-east-1 --bucket mattlane.us --deleteRemoved
      - run: npx aws-cloudfront-invalidate ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
