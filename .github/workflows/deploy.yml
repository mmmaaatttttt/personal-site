name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-base.yml
    with:
      bucket: mattlane.us
      base_url: https://mattlane.us
      role_arn: arn:aws:iam::492635958177:role/GitHubActionsPersonalSiteDeployRole
    secrets:
      cloudfront_distribution_id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
