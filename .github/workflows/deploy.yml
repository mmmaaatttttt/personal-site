name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-base.yml
    with:
      bucket: mattlane.us
      base_url: https://mattlane.us
      role_arn: arn:aws:iam::492635958177:role/GitHubActionsPersonalSiteDeployRole
    secrets:
      cloudfront_distribution_id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      turnstile_site_key: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy-worker:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check for worker changes
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD -- workers/ | grep -q .; then
            echo "workers=true" >> $GITHUB_OUTPUT
          else
            echo "workers=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v6
        if: steps.changed.outputs.workers == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.changed.outputs.workers == 'true'
      - run: npx wrangler deploy --config workers/subscribe/wrangler.toml
        if: steps.changed.outputs.workers == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
