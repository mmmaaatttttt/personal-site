name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      packages-only: ${{ steps.check.outputs.packages-only }}
    steps:
      - name: Check if only package files changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.number }}/files --jq '[.[].filename]')
          echo "Changed files: $files"
          packages_only=$(echo "$files" | jq 'all(. == "package.json" or . == "package-lock.json")')
          echo "packages-only=$packages_only" >> $GITHUB_OUTPUT

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.packages-only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
            out
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ hashFiles('app/**', 'components/**', 'content/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - run: npm run test:e2e -- --project=chromium
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  argos-skip:
    needs: [changes]
    if: always() && needs.changes.result != 'skipped' && needs.changes.outputs.packages-only == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report argos as passing for package-only PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'argos',
              description: 'Skipped: only package files changed',
            });

  all-checks:
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed or skipped
        run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "test:  ${{ needs.test.result }}"
          echo "e2e:   ${{ needs.e2e.result }}"
          for result in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.e2e.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
